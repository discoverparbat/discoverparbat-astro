# Builds the real site and puts the finished files on the "deploy" branch.
# Hostinger's Git deployment pulls that branch into public_html, so the live
# site only ever gets plain HTML, photos, .htaccess and inquiry.php.
# (smtp-config.php is never in Git — it stays on the server only.)
name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist/ to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
